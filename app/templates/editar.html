{% extends "layout.html" %}

{% block titulo %}Editar producto - Marimonia{% endblock %}

{% block contenido %}

<div class="editar-layout">
    <div class="editar-header">
        <h2>Editar producto</h2>
        <p>Modificá los datos del producto</p>
    </div>

    <div class="editar-form">
        <form method="POST" action="{{ url_for('main.guardar_producto', id=producto.id) }}" enctype="multipart/form-data">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" name="nombre" value="{{ producto.nombre }}" required>
            </div>

            <div class="form-group">
                <label>Descripción</label>
                <textarea name="descripcion" rows="5">{{ producto.descripcion }}</textarea>
            </div>

            <div class="form-group">
                <label>Categoría</label>
                <select name="categoria">
                    {% for categoria in categorias %}
                    <option value="{{ categoria.id }}" {% if categoria.id == producto.categoria_id %}selected{% endif %}>
                        {{ categoria.nombre }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            {% if producto.imagen %}
            <div class="form-group">
                <label>Imagen actual</label>
                <div class="current-image">
                    <img src="{{ url_for('static', filename='images/productos/' + producto.imagen) }}" alt="{{ producto.nombre }}">
                </div>
            </div>
            {% endif %}

            <div class="form-group">
                <label>Nueva imagen (opcional)</label>
                <input type="file" name="imagen">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a href="{{ url_for('main.admin') }}" class="btn btn-ghost">Cancelar</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
