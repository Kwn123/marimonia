<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar categoría - Marimonia</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="admin-layout">
        <div class="admin-header">
            <h1>Editar categoría</h1>
            <div class="admin-nav">
                <a href="/admin">Volver al panel</a>
            </div>
        </div>

        <div class="editar-layout">
            <div class="editar-form">
                <form action="{{ url_for('main.guardar_categoria', id=categoria.id) }}" method="POST" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" name="nombre" value="{{ categoria.nombre }}" required>
                    </div>

                    {% if categoria.imagen %}
                    <div class="form-group">
                        <label>Imagen actual</label>
                        <div class="current-image">
                            <img src="{{ url_for('static', filename='images/categorias/' + categoria.imagen) }}" alt="{{ categoria.nombre }}">
                        </div>
                    </div>
                    {% endif %}

                    <div class="form-group">
                        <label>Nueva imagen (opcional)</label>
                        <input type="file" name="imagen">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                        <a href="{{ url_for('main.admin') }}" class="btn btn-ghost">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
